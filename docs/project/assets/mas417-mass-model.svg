<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" font-family="Helvetica, Arial, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="inner"><rect x="58" y="78" width="324" height="134"/></clipPath>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#111827"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="860" height="330" rx="12" fill="#ffffff"/>
  <text x="220" y="40" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">A printed part, cut open</text>

  <!-- solid walls -->
  <rect x="40" y="60" width="360" height="170" fill="#fb923c" stroke="#9a3412" stroke-width="1.5"/>
  <!-- inside -->
  <rect x="58" y="78" width="324" height="134" fill="#ffffff"/>
  <g clip-path="url(#inner)" stroke="#fdba74" stroke-width="4">
    <line x1="18" y1="212" x2="152" y2="78"/><line x1="58" y1="212" x2="192" y2="78"/>
    <line x1="98" y1="212" x2="232" y2="78"/><line x1="138" y1="212" x2="272" y2="78"/>
    <line x1="178" y1="212" x2="312" y2="78"/><line x1="218" y1="212" x2="352" y2="78"/>
    <line x1="258" y1="212" x2="392" y2="78"/><line x1="298" y1="212" x2="432" y2="78"/>
    <line x1="338" y1="212" x2="472" y2="78"/>
    <line x1="18" y1="78" x2="152" y2="212"/><line x1="58" y1="78" x2="192" y2="212"/>
    <line x1="98" y1="78" x2="232" y2="212"/><line x1="138" y1="78" x2="272" y2="212"/>
    <line x1="178" y1="78" x2="312" y2="212"/><line x1="218" y1="78" x2="352" y2="212"/>
    <line x1="258" y1="78" x2="392" y2="212"/><line x1="298" y1="78" x2="432" y2="212"/>
    <line x1="338" y1="78" x2="472" y2="212"/>
  </g>
  <rect x="58" y="78" width="324" height="134" fill="none" stroke="#9a3412" stroke-width="1"/>

  <!-- callouts -->
  <line x1="440" y1="90" x2="402" y2="68" stroke="#111827" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="448" y="88" font-weight="bold" fill="#111827">Walls (solid plastic)</text>
  <text x="448" y="106" fill="#111827">thickness t = walls × line width, e.g. 2 × 0.45 mm = 0.9 mm</text>
  <line x1="440" y1="170" x2="345" y2="150" stroke="#111827" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="448" y="168" font-weight="bold" fill="#111827">Infill (mostly air)</text>
  <text x="448" y="186" fill="#111827">only the infill fraction is plastic, e.g. 20 %</text>

  <!-- formula -->
  <g fill="#111827" font-size="14">
    <text x="40" y="268">V = solid volume from CadQuery,   A = surface area from CadQuery</text>
    <text x="40" y="292">V_walls ≈ min(V, A × t)          V_effective = V_walls + infill × (V − V_walls)</text>
    <text x="40" y="316" font-weight="bold">mass [g] = density [g/cm³] × V_effective [mm³] / 1000</text>
  </g>
</svg>
