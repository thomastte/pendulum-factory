<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" font-family="Helvetica, Arial, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="open" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L11,6 L0,12" fill="none" stroke="#111827" stroke-width="1.5"/>
    </marker>
    <g id="actor" stroke="#111827" stroke-width="2" fill="none">
      <circle cx="0" cy="-38" r="11" fill="#ffffff"/>
      <line x1="0" y1="-27" x2="0" y2="5"/>
      <line x1="-20" y1="-15" x2="20" y2="-15"/>
      <line x1="0" y1="5" x2="-16" y2="32"/>
      <line x1="0" y1="5" x2="16" y2="32"/>
    </g>
  </defs>
  <rect x="0" y="0" width="980" height="560" rx="12" fill="#ffffff"/>

  <!-- system boundary -->
  <rect x="200" y="30" width="600" height="500" fill="#f8fafc" stroke="#111827" stroke-width="1.5"/>
  <text x="500" y="54" text-anchor="middle" font-weight="bold" fill="#111827">Pendulum kit factory</text>

  <!-- associations (solid lines) -->
  <g stroke="#111827" stroke-width="1.4">
    <line x1="112" y1="140" x2="237" y2="96"/>
    <line x1="112" y1="148" x2="232" y2="188"/>
    <line x1="112" y1="388" x2="299" y2="218"/>
    <line x1="112" y1="396" x2="237" y2="456"/>
    <line x1="112" y1="380" x2="543" y2="244"/>
    <line x1="868" y1="280" x2="707" y2="104"/>
    <line x1="868" y1="285" x2="707" y2="222"/>
    <line x1="868" y1="290" x2="707" y2="340"/>
  </g>

  <!-- actors -->
  <use href="#actor" x="90" y="160"/>
  <text x="90" y="215" text-anchor="middle" fill="#111827">Customer</text>
  <use href="#actor" x="90" y="408"/>
  <text x="90" y="463" text-anchor="middle" fill="#111827">Operator</text>
  <use href="#actor" x="890" y="300"/>
  <text x="890" y="355" text-anchor="middle" fill="#111827">Spoolman</text>
  <text x="890" y="371" text-anchor="middle" font-size="11" fill="#374151">(material stock)</text>

  <!-- use cases -->
  <g fill="#ffffff" stroke="#111827" stroke-width="1.5">
    <ellipse cx="330" cy="100" rx="100" ry="30"/>
    <ellipse cx="330" cy="190" rx="100" ry="30"/>
    <ellipse cx="330" cy="460" rx="100" ry="30"/>
    <ellipse cx="612" cy="100" rx="100" ry="30"/>
    <ellipse cx="612" cy="222" rx="100" ry="30"/>
    <ellipse cx="612" cy="340" rx="100" ry="30"/>
    <ellipse cx="612" cy="460" rx="100" ry="30"/>
  </g>
  <g text-anchor="middle" fill="#111827">
    <text x="330" y="105">Place order</text>
    <text x="330" y="187">View order status</text><text x="330" y="203">and 3MF files</text>
    <text x="330" y="465">Start production</text>
    <text x="612" y="97">Select filament</text><text x="612" y="113">for each part</text>
    <text x="612" y="219">Register filaments</text><text x="612" y="235">and spools</text>
    <text x="612" y="337">Register filament</text><text x="612" y="353">use</text>
    <text x="612" y="465">Process order</text>
  </g>

  <!-- include relationships: dashed line, open arrow (UML standard) -->
  <g stroke="#111827" stroke-width="1.4" stroke-dasharray="7 5" fill="none">
    <line x1="430" y1="100" x2="510" y2="100" marker-end="url(#open)"/>
    <line x1="430" y1="460" x2="510" y2="460" marker-end="url(#open)"/>
    <line x1="612" y1="430" x2="612" y2="372" marker-end="url(#open)"/>
  </g>
  <g font-size="12" fill="#111827" text-anchor="middle">
    <text x="470" y="90">«include»</text>
    <text x="470" y="450">«include»</text>
    <text x="660" y="405">«include»</text>
  </g>
</svg>
