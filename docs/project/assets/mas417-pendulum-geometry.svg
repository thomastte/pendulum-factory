<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 610" width="980" height="610" font-family="Helvetica, Arial, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111827"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="980" height="610" rx="12" fill="#ffffff"/>

  <!-- ===== FRONT VIEW ===== -->
  <text x="230" y="36" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">Front view (looking along the axle)</text>
  <!-- base -->
  <rect x="70" y="470" width="320" height="30" fill="#9ca3af" stroke="#374151" stroke-width="1.5"/>
  <!-- stand (behind) -->
  <rect x="200" y="70" width="60" height="400" fill="#93c5fd" stroke="#1d4ed8" stroke-width="1.5"/>
  <!-- weight -->
  <circle cx="230" cy="330" r="55" fill="#f87171" stroke="#b91c1c" stroke-width="1.5"/>
  <!-- arm passes through weight -->
  <rect x="220" y="110" width="20" height="290" fill="#fdba74" stroke="#c2410c" stroke-width="1.5"/>
  <!-- hub + axle -->
  <circle cx="230" cy="110" r="22" fill="#fdba74" stroke="#c2410c" stroke-width="1.5"/>
  <circle cx="230" cy="110" r="8" fill="#4b5563"/>
  <!-- centre marks -->
  <circle cx="230" cy="330" r="3" fill="#111827"/>

  <!-- extension lines -->
  <g stroke="#6b7280" stroke-width="1">
    <line x1="252" y1="110" x2="345" y2="110"/>
    <line x1="285" y1="330" x2="305" y2="330"/>
    <line x1="240" y1="400" x2="355" y2="400"/>
    <line x1="390" y1="470" x2="355" y2="470"/>
    <line x1="200" y1="110" x2="95" y2="110"/>
    <line x1="70" y1="470" x2="95" y2="470"/>
  </g>
  <!-- dimension: weight position -->
  <line x1="298" y1="112" x2="298" y2="328" stroke="#111827" stroke-width="1.4" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="290" y="225" text-anchor="end" font-weight="bold" fill="#111827">L</text><text x="291" y="229" font-size="10" fill="#111827" text-anchor="start">w</text>
  <!-- dimension: arm length -->
  <line x1="345" y1="112" x2="345" y2="398" stroke="#111827" stroke-width="1.4" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="352" y="260" fill="#111827">arm</text><text x="352" y="276" fill="#111827">length</text>
  <!-- dimension: clearance -->
  <line x1="345" y1="402" x2="345" y2="468" stroke="#111827" stroke-width="1.4" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="352" y="440" fill="#111827">c</text>
  <!-- dimension: stand height -->
  <line x1="95" y1="112" x2="95" y2="468" stroke="#111827" stroke-width="1.4" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="88" y="285" text-anchor="end" fill="#111827">H</text>
  <!-- weight radius -->
  <line x1="232" y1="328" x2="268" y2="292" stroke="#111827" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="262" y="318" font-weight="bold" fill="#111827">R</text>
  <!-- swing arc -->
  <path d="M 161.4 432.8 A 330 330 0 0 0 298.6 432.8" fill="none" stroke="#111827" stroke-width="1.4" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="140" y="440" text-anchor="end" fill="#111827">swing ±θ</text><text x="141" y="444" font-size="10" fill="#111827">0</text>

  <!-- ===== SIDE VIEW ===== -->
  <text x="705" y="36" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">Side view (axle runs left to right)</text>
  <rect x="560" y="470" width="290" height="30" fill="#9ca3af" stroke="#374151" stroke-width="1.5"/>
  <rect x="610" y="70" width="24" height="400" fill="#93c5fd" stroke="#1d4ed8" stroke-width="1.5"/>
  <rect x="776" y="70" width="24" height="400" fill="#93c5fd" stroke="#1d4ed8" stroke-width="1.5"/>
  <rect x="595" y="104" width="220" height="12" fill="#4b5563"/>
  <rect x="650" y="88" width="110" height="44" fill="#fdba74" stroke="#c2410c" stroke-width="1.5"/>
  <rect x="690" y="132" width="30" height="268" fill="#fdba74" stroke="#c2410c" stroke-width="1.5"/>
  <rect x="665" y="275" width="80" height="110" fill="#f87171" stroke="#b91c1c" stroke-width="1.5"/>
  <!-- inner span -->
  <line x1="636" y1="440" x2="774" y2="440" stroke="#111827" stroke-width="1.4" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="705" y="432" text-anchor="middle" fill="#111827">inner span</text>
  <!-- weight thickness -->
  <line x1="667" y1="262" x2="743" y2="262" stroke="#111827" stroke-width="1.4" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="705" y="254" text-anchor="middle" fill="#111827">weight thickness</text>
  <!-- hub length -->
  <line x1="652" y1="76" x2="758" y2="76" stroke="#111827" stroke-width="1.4" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="705" y="68" text-anchor="middle" fill="#111827">hub length</text>

  <!-- ===== LEGEND ===== -->
  <g font-size="13" fill="#111827">
    <rect x="40" y="532" width="16" height="16" fill="#9ca3af" stroke="#374151"/><text x="64" y="545">Base</text>
    <rect x="150" y="532" width="16" height="16" fill="#93c5fd" stroke="#1d4ed8"/><text x="174" y="545">Stand sides (×2)</text>
    <rect x="330" y="532" width="16" height="16" fill="#fdba74" stroke="#c2410c"/><text x="354" y="545">Arm with hub: rotates on the axle (clearance fit)</text>
    <rect x="40" y="566" width="16" height="16" fill="#f87171" stroke="#b91c1c"/><text x="64" y="579">Weight: slides onto the arm, glued or pressed</text>
    <rect x="420" y="566" width="16" height="16" fill="#4b5563"/><text x="444" y="579">Axle: fixed in the stands (press fit), does not swing</text>
  </g>
</svg>
